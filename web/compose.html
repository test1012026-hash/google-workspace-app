<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecureDocShare — Compose</title>
    <?!= include('Stylesheet'); ?>
  </head>
  <body class="is-embed is-compose-modal">
    <div id="app-body" class="pane">
      <div id="compose-gate" class="panel" style="display:none">
        <p class="status-error" id="compose-gate-msg">
          Sign in from the SecureDocShare side panel first, then open Compose again.
        </p>
      </div>

      <div id="compose-modal-root" class="encrypt-result panel" style="display:none">
        <p class="status-ok" id="compose-user-label" style="margin:0 0 4px">Compose</p>
        <p class="hint" id="compose-hint">
          Type a name or email to search Google Contacts. Selected recipients appear as chips.
        </p>

        <label class="label">Recipient email</label>
        <div id="recipient-input-root"></div>
        <input id="encrypt-to" class="field" type="email" style="display:none" aria-hidden="true" />

        <label class="label" for="encrypt-subject">Subject</label>
        <input
          id="encrypt-subject"
          class="field"
          type="text"
          placeholder="Subject"
        />

        <label class="label" for="encrypt-message">Message</label>
        <textarea
          id="encrypt-message"
          class="input"
          placeholder="Type your message…"
          rows="6"
        ></textarea>

        <label class="label" for="encrypt-file">File (optional)</label>
        <input id="encrypt-file" class="field" type="file" />

        <div class="btn-row" style="margin-top:4px">
          <button id="btn-encrypt-send" class="btn btn-primary" type="button">Encrypt and send</button>
          <button id="btn-encrypt" class="btn btn-secondary" type="button">Encrypt only</button>
        </div>
        <p class="hint" id="compose-status" style="margin-top:8px"></p>

        <div id="encrypt-success" style="display:none" class="encrypt-result">
          <p class="status-ok" id="encrypt-success-label">✔ Encrypted successfully</p>
          <label class="label" for="encrypt-cipher-out">Message ciphertext</label>
          <textarea id="encrypt-cipher-out" class="input" readonly></textarea>
          <div class="btn-row">
            <button type="button" id="btn-copy-cipher" class="btn btn-secondary">Copy ciphertext</button>
            <a id="encrypt-download" class="btn btn-primary download-btn" style="display:none" download>
              ⬇ Download encrypted file
            </a>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__COMPOSE_MODAL__ = true;
      window.__WORKSPACE_SESSION__ = <?!= sessionJson ?>;
    </script>
    <?!= include('Config'); ?>
    <?!= include('Common'); ?>
    <?!= include('ComposeUi'); ?>
    <?!= include('GmailSend'); ?>
    <?!= include('App'); ?>
  </body>
</html>
