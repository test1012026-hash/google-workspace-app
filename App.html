<script>
/**
 * SecureDocShare Workspace UI — login, encrypt, decrypt for Gmail HtmlService.
 */

function getApiBaseUrl() {
  if (typeof SecureDocConfig !== "undefined" && SecureDocConfig.getApiBaseUrl) {
    return SecureDocConfig.getApiBaseUrl();
  }
  return (
    (typeof DEFAULT_API_BASE !== "undefined" && DEFAULT_API_BASE) ||
    "https://server-nine-rosy.vercel.app/api"
  );
}

/** @deprecated use getApiBaseUrl */
function apiBase() {
  return getApiBaseUrl();
}

function storedSessionToken() {
  if (typeof getStoredSession !== "function") return "";
  var session = getStoredSession();
  return session && session.token ? String(session.token) : "";
}

var _authReady = false;
var _authMode = "login";
var _signupOtpSent = false;
var _uiMode = "encrypt";
var _sessionEmail = "";
var _subscriptionActive = false;
var _sessionToken = "";
var _recipientInput = null;

document.addEventListener("DOMContentLoaded", function () {
  if (window.__COMPOSE_MODAL__) {
    bootComposeModal_();
    return;
  }
  initAuthUi();
  setAuthMode("login");
  bindModeTabs();
  initRecipientChips_();
  bindEncryptUi();
  bindDecryptUi();
  applyViewQuery_();
  if (handleOAuthTicketQuery_()) return;
  handleSsoLaunchQuery_();
  refreshAuthState(function () {});
});

/**
 * Card compose overlay: recipient chips + subject + message using add-on session.
 */
function bootComposeModal_() {
  try {
    document.documentElement.classList.add("is-embed", "is-compose-modal");
    document.body.classList.add("is-embed", "is-compose-modal");
  } catch (e0) {}

  _uiMode = "encrypt";
  initRecipientChips_();
  bindEncryptUi();

  var gate = document.getElementById("compose-gate");
  var root = document.getElementById("compose-modal-root");
  var gateMsg = document.getElementById("compose-gate-msg");
  var userLabel = document.getElementById("compose-user-label");

  function showGate(msg) {
    if (gateMsg && msg) gateMsg.textContent = msg;
    if (gate) gate.style.display = "block";
    if (root) root.style.display = "none";
  }

  function showCompose(email) {
    if (gate) gate.style.display = "none";
    if (root) root.style.display = "flex";
    if (userLabel) {
      userLabel.textContent = email
        ? "Signed in as " + email
        : "SecureDoc compose";
    }
  }

  function applySession(session) {
    if (!session || !session.token) {
      showGate(
        "Sign in from the SecureDocShare side panel first, then open Compose again."
      );
      return;
    }
    try {
      if (typeof saveSession === "function") {
        saveSession({
          token: session.token,
          email: session.email || "",
          expiresAt: session.expiresAt || null,
        });
      }
    } catch (e1) {}
    _sessionToken = String(session.token);
    _sessionEmail = String(session.email || "");
    _authReady = true;

    requireAuthAndSubscription(function (ok, errMsg) {
      if (!ok) {
        showGate(
          errMsg ||
            "Sign in with an active subscription from the SecureDocShare side panel."
        );
        return;
      }
      showCompose(_sessionEmail);
    });
  }

  var injected = null;
  try {
    injected = window.__WORKSPACE_SESSION__ || null;
  } catch (e2) {
    injected = null;
  }

  if (injected && injected.token) {
    applySession(injected);
    return;
  }

  hydrateSessionFromAppsScript_(function (session) {
    if (session && session.token) {
      applySession(session);
      return;
    }
    var local =
      typeof getStoredSession === "function" ? getStoredSession() : null;
    if (local && local.token) {
      applySession(local);
      return;
    }
    showGate(
      "Sign in from the SecureDocShare side panel first, then open Compose again."
    );
  });
}

/** Card "Compose & send" → ?view=compose&embed=1 (Gmail overlay). */
function applyViewQuery_() {
  try {
    var params = new URLSearchParams(location.search || "");
    var view = params.get("view");
    var embed = params.get("embed") === "1";
    if (view === "compose" || view === "encrypt") {
      _uiMode = "encrypt";
    } else if (view === "decrypt") {
      _uiMode = "decrypt";
    }
    if (embed) {
      try {
        document.documentElement.classList.add("is-embed");
        document.body.classList.add("is-embed");
      } catch (e0) {}
    }
  } catch (e) {}
}

function initComposeWidgets_() {
  initRecipientChips_();
}

/** Recipient chips + Google Contacts dropdown (People API via Apps Script). */
function initRecipientChips_() {
  var recipientRoot = document.getElementById("recipient-input-root");
  if (!recipientRoot || typeof createRecipientInput !== "function") {
    var fallback = document.getElementById("encrypt-to");
    if (fallback) fallback.style.display = "";
    return;
  }
  if (_recipientInput) return;
  _recipientInput = createRecipientInput(recipientRoot, {
    placeholder: "Type name or email…",
    onChange: function (emails) {
      var hidden = document.getElementById("encrypt-to");
      if (hidden) hidden.value = (emails || []).join(", ");
    },
  });
}

/**
 * Legacy: OAuth returned to Apps Script ?oauth_ticket=…
 * Complete login here, notify opener, close popup (or refresh this panel).
 * @returns {boolean} true if a ticket was handled (skip normal boot).
 */
function handleOAuthTicketQuery_() {
  var params;
  try {
    params = new URLSearchParams(location.search || "");
  } catch (e) {
    return false;
  }
  var ticket = params.get("oauth_ticket");
  var oauthErr = params.get("oauth_error");
  if (!ticket && !oauthErr) return false;

  var gate = document.getElementById("auth-gate-hint");
  if (gate) {
    gate.style.display = "block";
    gate.textContent = oauthErr ? oauthErr : "Completing Google sign-in…";
  }

  function stripTicketFromUrl_() {
    try {
      var u = new URL(location.href);
      u.searchParams.delete("oauth_ticket");
      u.searchParams.delete("oauth_error");
      history.replaceState({}, "", u.pathname + u.search + u.hash);
    } catch (e2) {}
  }

  function notifyOpenerAndClose_(payload) {
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(
          Object.assign({ type: "securedoc-oauth" }, payload),
          "*"
        );
      }
    } catch (e3) {}
    setTimeout(function () {
      try {
        window.close();
      } catch (e4) {}
    }, 400);
  }

  if (oauthErr) {
    setLoginError(oauthErr);
    notifyOpenerAndClose_({ ok: false, error: oauthErr });
    stripTicketFromUrl_();
    return true;
  }

  if (typeof completeOAuthTicket !== "function") {
    setLoginError("OAuth helper not loaded.");
    return true;
  }

  completeOAuthTicket({ ticket: ticket, apiBaseUrl: apiBase() }).then(
    function (res) {
      setSsoBusy(false);
      if (!res || !res.ok) {
        var err =
          (res && res.data && (res.data.error || res.data.message)) ||
          "Google sign-in failed";
        setLoginError(err);
        notifyOpenerAndClose_({ ok: false, error: err });
        stripTicketFromUrl_();
        return;
      }
      var data = res.data || {};
      var token = data.token || data.accessToken || "";
      var email = data.email || "";
      if (typeof storeAuthResponse === "function" && token) {
        storeAuthResponse(
          {
            token: token,
            expiresAt: data.expiresAt,
            email: email,
            refreshToken: data.refreshToken,
          },
          email
        );
      }
      try {
        if (
          typeof google !== "undefined" &&
          google.script &&
          google.script.run &&
          typeof google.script.run.saveWorkspaceSession === "function"
        ) {
          google.script.run.saveWorkspaceSession({
            token: token,
            email: email,
            expiresAt: data.expiresAt || null,
          });
        }
      } catch (e5) {}

      notifyOpenerAndClose_({
        ok: true,
        token: token,
        email: email,
        expiresAt: data.expiresAt || null,
        refreshToken: data.refreshToken || null,
      });
      stripTicketFromUrl_();
      // If this tab is the app (not a popup), show logged-in UI.
      if (!window.opener || window.opener.closed) {
        refreshAuthState(function () {});
      }
    }
  );
  return true;
}

/** Card "Continue with Google" opens ?sso=google → start popup here. */
function handleSsoLaunchQuery_() {
  var params;
  try {
    params = new URLSearchParams(location.search || "");
  } catch (e) {
    return;
  }
  if (params.get("sso") !== "google") return;

  var intent = params.get("intent") === "signup" ? "signup" : "login";
  var acceptTerms =
    params.get("acceptTerms") === "1" || params.get("acceptTerms") === "true";

  if (intent === "signup") {
    setAuthMode("signup");
    var termsBox = document.getElementById("accept-terms");
    if (termsBox) termsBox.checked = true;
  }

  var gate = document.getElementById("auth-gate-hint");
  if (gate) {
    gate.style.display = "block";
    gate.textContent = "Opening Google sign-in popup…";
  }
  setLoginError("");
  setSsoBusy(true);

  if (typeof loginWithOAuth !== "function") {
    setSsoBusy(false);
    setLoginError("OAuth helper not loaded.");
    return;
  }

  loginWithOAuth({
    provider: "google",
    intent: intent,
    acceptTerms: intent === "signup" ? true : acceptTerms,
    apiBaseUrl: apiBase(),
  })
    .then(function (res) {
      setSsoBusy(false);
      if (!res || !res.ok) {
        setLoginError((res && res.error) || "Google sign-in failed");
        if (gate) gate.textContent = "Sign in above to use Encrypt and Decrypt.";
        return;
      }
      if (gate) {
        gate.textContent =
          "Signed in. Close this window — the Gmail add-on will reload.";
      }
      refreshAuthState(function () {});
      try {
        // Clean query so refresh does not re-open Google.
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, "", location.pathname);
        }
      } catch (e2) {}
    })
    .catch(function (err) {
      setSsoBusy(false);
      setLoginError(err.message || String(err));
      if (gate) gate.textContent = "Sign in above to use Encrypt and Decrypt.";
    });
}

function setAuthMode(next) {
  _authMode = next === "signup" ? "signup" : "login";
  _signupOtpSent = false;
  setLoginError("");

  var title = document.getElementById("auth-title");
  var hint = document.getElementById("auth-mode-hint");
  var termsRow = document.getElementById("terms-row");
  var termsLink = document.getElementById("terms-link");
  var termsBox = document.getElementById("accept-terms");
  var otpRow = document.getElementById("otp-row");
  var otpEl = document.getElementById("signup-otp");
  var otpHint = document.getElementById("otp-hint");
  var btn = document.getElementById("btn-login");
  var toggle = document.getElementById("btn-toggle-auth-mode");
  var passEl = document.getElementById("login-password");

  if (title) title.textContent = _authMode === "signup" ? "Sign up" : "Log in";
  // if (hint) {
  //   hint.textContent =
  //     "Encrypt and share documents with identity-locked access.";
  // }
  if (termsRow) termsRow.style.display = _authMode === "signup" ? "flex" : "none";
  if (otpRow) otpRow.style.display = "none";
  if (otpEl) otpEl.value = "";
  if (otpHint) otpHint.textContent = "";
  if (termsBox) termsBox.checked = false;
  if (termsLink && typeof SecureDocConfig !== "undefined" && SecureDocConfig.getTermsUrl) {
    termsLink.href = SecureDocConfig.getTermsUrl();
  }
  if (btn) {
    btn.textContent =
      _authMode === "signup" ? "Send verification code" : "Log in";
    btn.disabled = false;
  }
  if (toggle) {
    toggle.textContent =
      _authMode === "signup"
        ? "Already have an account? Log in"
        : "Need an account? Sign up";
  }
  if (passEl) {
    passEl.autocomplete =
      _authMode === "signup" ? "new-password" : "current-password";
  }
}

function initAuthUi() {
  var link = document.getElementById("login-web-link");
  if (link) {
    link.href =
      typeof getLoginWebUrl === "function"
        ? getLoginWebUrl()
        : "https://admin-panel-amber-nine.vercel.app/login";
  }

  var termsLink = document.getElementById("terms-link");
  if (termsLink && typeof SecureDocConfig !== "undefined" && SecureDocConfig.getTermsUrl) {
    termsLink.href = SecureDocConfig.getTermsUrl();
  }

  var btnLogin = document.getElementById("btn-login");
  var btnLogout = document.getElementById("btn-logout");
  var btnToggle = document.getElementById("btn-toggle-auth-mode");
  var btnResendOtp = document.getElementById("btn-resend-otp");

  if (btnToggle && !btnToggle.dataset.bound) {
    btnToggle.dataset.bound = "1";
    btnToggle.addEventListener("click", function () {
      setAuthMode(_authMode === "login" ? "signup" : "login");
    });
  }
  if (btnLogin && !btnLogin.dataset.bound) {
    btnLogin.dataset.bound = "1";
    btnLogin.addEventListener("click", onTaskpaneAuthSubmit);
  }
  if (btnResendOtp && !btnResendOtp.dataset.bound) {
    btnResendOtp.dataset.bound = "1";
    btnResendOtp.addEventListener("click", onResendSignupOtp);
  }
  if (btnLogout && !btnLogout.dataset.bound) {
    btnLogout.dataset.bound = "1";
    btnLogout.addEventListener("click", function () {
      btnLogout.disabled = true;
      var run =
        typeof logoutSession === "function"
          ? logoutSession({ apiBaseUrl: apiBase() })
          : Promise.resolve(
              typeof clearSession === "function" ? clearSession() : null
            );
      Promise.resolve(run)
        .catch(function () {})
        .then(function () {
          btnLogout.disabled = false;
          _sessionEmail = "";
          _sessionToken = "";
          _subscriptionActive = false;
          syncSessionToAppsScript(null);
          setAuthMode("login");
          resetToolPanels();
          refreshAuthState(function () {});
        });
    });
  }

  bindSsoButtons();
}

function bindSsoButtons() {
  var btn = document.getElementById("btn-sso-google");
  if (!btn || btn.dataset.bound) return;
  btn.dataset.bound = "1";
  btn.addEventListener("click", function () {
    onSsoClick({ currentTarget: btn });
  });
}

function refreshSsoProviders() {
  /* Google-only UI (same as Chrome extension). */
}

function setSsoBusy(busy) {
  var btn = document.getElementById("btn-sso-google");
  if (btn) {
    btn.disabled = Boolean(busy);
    btn.textContent = busy ? "Connecting Google..." : "Continue with Google";
  }
  var loginBtn = document.getElementById("btn-login");
  if (loginBtn) loginBtn.disabled = Boolean(busy);
}

function onSsoClick(ev) {
  var btn = ev.currentTarget;
  var provider = btn && btn.getAttribute("data-provider");
  if (!provider) return;
  if (typeof loginWithOAuth !== "function") {
    setLoginError("OAuth helper not loaded.");
    return;
  }
  var isSignup = _authMode === "signup";
  var termsBox = document.getElementById("accept-terms");
  if (isSignup && (!termsBox || !termsBox.checked)) {
    setLoginError("Accept Terms & Conditions to sign up.");
    return;
  }
  setLoginError("");
  setSsoBusy(true);
  loginWithOAuth({
    provider: provider,
    intent: isSignup ? "signup" : "login",
    acceptTerms: isSignup,
    apiBaseUrl: apiBase(),
  })
    .then(function (res) {
      setSsoBusy(false);
      if (!res || !res.ok) {
        setLoginError((res && res.error) || "SSO failed");
        return;
      }
      refreshAuthState(function () {});
    })
    .catch(function (err) {
      setSsoBusy(false);
      setLoginError(err.message || String(err));
    });
}

function setLoginError(msg) {
  var el = document.getElementById("login-error");
  if (!el) return;
  if (!msg) {
    el.style.display = "none";
    el.textContent = "";
    return;
  }
  el.style.display = "block";
  el.textContent = msg;
}

function onResendSignupOtp() {
  var emailEl = document.getElementById("login-email");
  var termsBox = document.getElementById("accept-terms");
  var email = emailEl ? String(emailEl.value || "").trim() : "";
  if (!email) {
    setLoginError("Enter email first.");
    return;
  }
  if (!termsBox || !termsBox.checked) {
    setLoginError("Accept Terms & Conditions.");
    return;
  }
  if (typeof sendSignupOtp !== "function") {
    setLoginError("Signup helper not loaded.");
    return;
  }
  setLoginError("");
  sendSignupOtp({
    email: email,
    acceptTerms: true,
    apiBaseUrl: apiBase(),
  }).then(function (res) {
    var hint = document.getElementById("otp-hint");
    if (!res || !res.ok) {
      setLoginError((res && res.error) || "Could not resend code");
      return;
    }
    if (hint) hint.textContent = "A new code was sent.";
  });
}

function onTaskpaneAuthSubmit() {
  var emailEl = document.getElementById("login-email");
  var passEl = document.getElementById("login-password");
  var termsBox = document.getElementById("accept-terms");
  var otpEl = document.getElementById("signup-otp");
  var email = emailEl ? String(emailEl.value || "").trim() : "";
  var password = passEl ? String(passEl.value || "") : "";
  var otp = otpEl ? String(otpEl.value || "").trim() : "";
  var isSignup = _authMode === "signup";

  if (!email || !password) {
    setLoginError("Email and password are required.");
    return;
  }
  if (isSignup && typeof signupWithPassword !== "function") {
    setLoginError("Signup helper not loaded.");
    return;
  }
  if (!isSignup && typeof loginWithPassword !== "function") {
    setLoginError("Login helper not loaded.");
    return;
  }

  var btn = document.getElementById("btn-login");
  if (btn) btn.disabled = true;
  setLoginError("");

  function resetBtn() {
    if (!btn) return;
    btn.disabled = false;
    btn.textContent = isSignup
      ? _signupOtpSent
        ? "Verify & sign up"
        : "Send verification code"
      : "Log in";
  }

  if (isSignup && !_signupOtpSent) {
    if (!termsBox || !termsBox.checked) {
      resetBtn();
      setLoginError("Accept Terms & Conditions.");
      return;
    }
    sendSignupOtp({
      email: email,
      acceptTerms: true,
      apiBaseUrl: apiBase(),
    })
      .then(function (res) {
        if (!res || !res.ok) {
          resetBtn();
          setLoginError((res && res.error) || "Could not send code");
          return;
        }
        _signupOtpSent = true;
        var otpRow = document.getElementById("otp-row");
        var hint = document.getElementById("otp-hint");
        if (otpRow) otpRow.style.display = "block";
        if (hint) hint.textContent = "Enter the 4-digit code from your email.";
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Verify & sign up";
        }
      })
      .catch(function (err) {
        resetBtn();
        setLoginError(err.message || String(err));
      });
    return;
  }

  var run = isSignup
    ? signupWithPassword({
        email: email,
        password: password,
        otp: otp,
        acceptTerms: true,
        apiBaseUrl: apiBase(),
      })
    : loginWithPassword({
        email: email,
        password: password,
        apiBaseUrl: apiBase(),
      });

  run
    .then(function (res) {
      resetBtn();
      if (!res || !res.ok) {
        setLoginError((res && res.error) || "Authentication failed");
        return;
      }
      _signupOtpSent = false;
      if (passEl) passEl.value = "";
      if (otpEl) otpEl.value = "";
      if (termsBox) termsBox.checked = false;
      setAuthMode("login");
      refreshAuthState(function () {});
    })
    .catch(function (err) {
      resetBtn();
      setLoginError(err.message || String(err));
    });
}

function refreshAuthState(done) {
  var loggedOut = document.getElementById("auth-logged-out");
  var loggedIn = document.getElementById("auth-logged-in");
  var label = document.getElementById("auth-user-label");
  var tools = document.getElementById("tools-wrap");
  var gate = document.getElementById("auth-gate-hint");
  var recipient = document.getElementById("recipient-email");

  function finish(ok, email, sub) {
    _authReady = Boolean(ok);
    _sessionEmail = ok ? email || "" : "";
    if (!ok) {
      _sessionToken = "";
      _subscriptionActive = false;
      syncSessionToAppsScript(null);
    }
    if (loggedOut) loggedOut.style.display = ok ? "none" : "block";
    if (loggedIn) loggedIn.style.display = ok ? "block" : "none";
    if (label) {
      label.className = "status-ok";
      label.textContent = ok
        ? "Signed in as " + (email || "SecureDoc user")
        : "Signed in";
    }
    updateSubscriptionLabel(ok ? sub : null);
    if (tools) tools.style.display = ok ? "block" : "none";
    if (gate) gate.style.display = ok ? "none" : "block";
    if (ok && recipient && email && !recipient.value) {
      recipient.value = email;
    }
    if (ok) setUiMode(_uiMode || "encrypt");
    if (typeof done === "function") done(ok);
  }

  function runEnsure() {
    if (typeof ensureAuthSession !== "function") {
      finish(false, null, null);
      return;
    }

    ensureAuthSession({ apiBaseUrl: apiBase() }).then(function (auth) {
      if (auth && auth.ok && auth.authenticated) {
        var email = auth.email || (auth.data && auth.data.email) || null;
        _sessionToken =
          auth.token ||
          (auth.data && auth.data.token) ||
          storedSessionToken() ||
          "";
        var sub = auth.subscription || (auth.data && auth.data.subscription) || {};
        _subscriptionActive = sub.subscriptionActive === true;
        syncSessionToAppsScript({
          token: _sessionToken,
          email: email,
          expiresAt: auth.expiresAt || (auth.data && auth.data.expiresAt),
        });
        finish(true, email, sub);
        return;
      }
      finish(false, null, null);
    });
  }

  // Card login lives in UserProperties — hydrate local session before API check.
  hydrateSessionFromAppsScript_(function () {
    runEnsure();
  });
}

function hydrateSessionFromAppsScript_(done) {
  try {
    if (
      typeof google === "undefined" ||
      !google.script ||
      !google.script.run ||
      typeof google.script.run.getWorkspaceSession !== "function"
    ) {
      if (typeof done === "function") done(null);
      return;
    }
    google.script.run
      .withSuccessHandler(function (session) {
        try {
          if (session && session.token && typeof saveSession === "function") {
            saveSession({
              token: session.token,
              email: session.email || "",
              expiresAt: session.expiresAt || null,
            });
          }
        } catch (e0) {}
        if (typeof done === "function") done(session || null);
      })
      .withFailureHandler(function () {
        if (typeof done === "function") done(null);
      })
      .getWorkspaceSession();
  } catch (e) {
    if (typeof done === "function") done(null);
  }
}

function syncSessionToAppsScript(session) {
  try {
    if (
      typeof google === "undefined" ||
      !google.script ||
      !google.script.run ||
      typeof google.script.run.saveWorkspaceSession !== "function"
    ) {
      return;
    }
    if (!session || !session.token) {
      google.script.run.clearWorkspaceSession();
      return;
    }
    google.script.run.saveWorkspaceSession({
      token: session.token,
      email: session.email || "",
      expiresAt: session.expiresAt || null,
    });
  } catch (e) {}
}

/**
 * Outlook/extension send gate: valid login token + active subscription.
 */
function requireAuthAndSubscription(done) {
  if (typeof ensureAuthSession !== "function") {
    done(false, "Auth helper not loaded.", null);
    return;
  }
  ensureAuthSession({ apiBaseUrl: apiBase() }).then(function (auth) {
    if (!auth || !auth.ok || !auth.authenticated) {
      _authReady = false;
      _subscriptionActive = false;
      refreshAuthState();
      done(
        false,
        (auth && auth.error) ||
          (typeof loginRequiredMessage === "function"
            ? loginRequiredMessage(
                auth && auth.code === "TOKEN_EXPIRED"
                  ? "Your session has expired."
                  : "You are not logged in."
              )
            : "Login required."),
        null
      );
      return;
    }

    _authReady = true;
    _sessionEmail = auth.email || _sessionEmail;
    _sessionToken =
      auth.token ||
      (auth.data && auth.data.token) ||
      storedSessionToken() ||
      "";

    var sub = auth.subscription || (auth.data && auth.data.subscription) || {};
    _subscriptionActive = sub.subscriptionActive === true;
    updateSubscriptionLabel(sub);

    if (!_subscriptionActive) {
      done(
        false,
        (sub && sub.error) ||
          "Subscription expired or inactive. Subscribe to encrypt and send.",
        auth
      );
      return;
    }

    syncSessionToAppsScript({
      token: _sessionToken,
      email: _sessionEmail,
      expiresAt: auth.expiresAt || (auth.data && auth.data.expiresAt),
    });
    done(true, null, auth);
  });
}

function updateSubscriptionLabel(sub) {
  var el = document.getElementById("auth-sub-label");
  if (!el) return;
  if (!sub) {
    el.textContent = "";
    return;
  }
  if (sub.subscriptionActive) {
    var days =
      sub.subscriptionDaysLeft != null ? sub.subscriptionDaysLeft : null;
    el.textContent =
      days != null
        ? "Subscription active · " + days + " day(s) left"
        : "Subscription active";
    el.className = "hint";
  } else {
    el.textContent =
      sub.error ||
      "Subscription inactive — encrypt/send blocked until renewed.";
    el.className = "status-error";
  }
}

function apiJson(path, options) {
  options = options || {};
  var headers = {
    "Content-Type": "application/json",
  };
  if (options.token) {
    headers.Authorization = "Bearer " + options.token;
  }
  return fetch(String(apiBase()).replace(/\/$/, "") + path, {
    method: options.method || "GET",
    headers: headers,
    body: options.body != null ? JSON.stringify(options.body) : undefined,
  }).then(function (res) {
    return res.text().then(function (text) {
      var data = null;
      try {
        data = text ? JSON.parse(text) : null;
      } catch (e) {
        data = { error: text || res.statusText };
      }
      return { res: res, data: data || {} };
    });
  });
}

function requireAuthOrPrompt(done) {
  if (typeof ensureAuthSession !== "function") {
    done(false, "Auth helper not loaded.");
    return;
  }
  ensureAuthSession({ apiBaseUrl: apiBase() }).then(function (auth) {
    if (auth && auth.ok && auth.authenticated) {
      _authReady = true;
      _sessionEmail = auth.email || _sessionEmail;
      _sessionToken =
        auth.token ||
        (auth.data && auth.data.token) ||
        storedSessionToken() ||
        _sessionToken;
      syncSessionToAppsScript({
        token: _sessionToken,
        email: _sessionEmail,
        expiresAt: auth.expiresAt || (auth.data && auth.data.expiresAt),
      });
      done(true, null);
      return;
    }
    _authReady = false;
    refreshAuthState();
    done(
      false,
      (auth && auth.error) ||
        (typeof loginRequiredMessage === "function"
          ? loginRequiredMessage(
              auth && auth.code === "TOKEN_EXPIRED"
                ? "Your session has expired."
                : "You are not logged in."
            )
          : "Login required.")
    );
  });
}

function bindModeTabs() {
  var tabs = document.querySelectorAll(".mode-tab");
  for (var i = 0; i < tabs.length; i++) {
    if (tabs[i].dataset.bound) continue;
    tabs[i].dataset.bound = "1";
    tabs[i].addEventListener("click", function (ev) {
      var mode = ev.currentTarget.getAttribute("data-mode");
      setUiMode(mode);
    });
  }
}

function setUiMode(mode) {
  _uiMode = mode === "decrypt" ? "decrypt" : "encrypt";
  var tabEncrypt = document.getElementById("tab-encrypt");
  var tabDecrypt = document.getElementById("tab-decrypt");
  var compose = document.getElementById("compose-view");
  var read = document.getElementById("read-view");
  if (tabEncrypt) {
    tabEncrypt.className =
      "mode-tab" + (_uiMode === "encrypt" ? " active" : "");
  }
  if (tabDecrypt) {
    tabDecrypt.className =
      "mode-tab" + (_uiMode === "decrypt" ? " active" : "");
  }
  if (compose) compose.style.display = _uiMode === "encrypt" ? "flex" : "none";
  if (read) read.style.display = _uiMode === "decrypt" ? "flex" : "none";
}

function setComposeStatus(msg) {
  var status = document.getElementById("compose-status");
  if (status) status.textContent = msg || "";
}

function bindEncryptUi() {
  var btn = document.getElementById("btn-encrypt");
  var btnSend = document.getElementById("btn-encrypt-send");
  var copyBtn = document.getElementById("btn-copy-cipher");
  if (btn && !btn.dataset.bound) {
    btn.dataset.bound = "1";
    btn.addEventListener("click", function () {
      onEncryptClick({ send: false });
    });
  }
  if (btnSend && !btnSend.dataset.bound) {
    btnSend.dataset.bound = "1";
    btnSend.addEventListener("click", function () {
      onEncryptClick({ send: true });
    });
  }
  if (copyBtn && !copyBtn.dataset.bound) {
    copyBtn.dataset.bound = "1";
    copyBtn.addEventListener("click", function () {
      var out = document.getElementById("encrypt-cipher-out");
      var text = out ? String(out.value || "") : "";
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () {
            setComposeStatus("Ciphertext copied.");
          },
          function () {
            out.select();
            document.execCommand("copy");
            setComposeStatus("Ciphertext copied.");
          }
        );
      } else {
        out.select();
        document.execCommand("copy");
        setComposeStatus("Ciphertext copied.");
      }
    });
  }
}

function setEncryptButtonsDisabled(disabled) {
  var btn = document.getElementById("btn-encrypt");
  var btnSend = document.getElementById("btn-encrypt-send");
  if (btn) btn.disabled = Boolean(disabled);
  if (btnSend) btnSend.disabled = Boolean(disabled);
  if (_recipientInput && typeof _recipientInput.setDisabled === "function") {
    _recipientInput.setDisabled(disabled);
  }
  var toEl = document.getElementById("encrypt-to");
  if (toEl) toEl.disabled = Boolean(disabled);
  var subEl = document.getElementById("encrypt-subject");
  if (subEl) subEl.disabled = Boolean(disabled);
  var msgEl = document.getElementById("encrypt-message");
  if (msgEl) msgEl.disabled = Boolean(disabled);
  var fileEl = document.getElementById("encrypt-file");
  if (fileEl) fileEl.disabled = Boolean(disabled);
}

function collectEncryptForm() {
  var subEl = document.getElementById("encrypt-subject");
  var msgEl = document.getElementById("encrypt-message");
  var fileEl = document.getElementById("encrypt-file");
  var recipients = [];
  if (_recipientInput && typeof _recipientInput.getEmails === "function") {
    recipients = _recipientInput.getEmails();
  } else {
    var toEl = document.getElementById("encrypt-to");
    var single = toEl ? String(toEl.value || "").trim() : "";
    if (single) {
      recipients = single.split(/[,;\s]+/).map(function (s) {
        return String(s || "").trim();
      }).filter(Boolean);
    }
  }
  return {
    recipients: recipients,
    subject: subEl ? String(subEl.value || "").trim() : "",
    message: msgEl ? String(msgEl.value || "") : "",
    file: fileEl && fileEl.files && fileEl.files[0] ? fileEl.files[0] : null,
  };
}

function clearEncryptForm_() {
  if (_recipientInput && typeof _recipientInput.clear === "function") {
    _recipientInput.clear();
  }
  var toEl = document.getElementById("encrypt-to");
  if (toEl) toEl.value = "";
  var subEl = document.getElementById("encrypt-subject");
  if (subEl) subEl.value = "";
  var msgEl = document.getElementById("encrypt-message");
  if (msgEl) msgEl.value = "";
  var fileEl = document.getElementById("encrypt-file");
  if (fileEl) fileEl.value = "";
}

function readFileAsBase64(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || "");
      var comma = text.indexOf(",");
      resolve(comma >= 0 ? text.slice(comma + 1) : text);
    };
    reader.onerror = function () {
      reject(new Error("Could not read the file."));
    };
    reader.readAsDataURL(file);
  });
}

function encryptForRecipient_(recipientEmail, form, fileParts) {
  var payload = {
    recipientEmail: recipientEmail,
    subject: form.subject,
    message: form.message || "",
  };
  if (fileParts.fileBase64) {
    payload.fileBase64 = fileParts.fileBase64;
    payload.fileName = fileParts.fileName;
    payload.mimeType = fileParts.mimeType;
  }
  return apiJson("/files/encrypt", {
    method: "POST",
    token: _sessionToken,
    body: payload,
  }).then(function (out) {
    var res = out.res;
    var data = out.data || {};
    if (!res.ok) {
      var code = data.code || "";
      if (code === "FILE_EXTENSION_BLOCKED") {
        throw new Error(
          data.error ||
            "This file extension is blocked by admin and cannot be encrypted."
        );
      }
      if (code === "SUBSCRIPTION_EXPIRED" || res.status === 403) {
        throw new Error(
          data.error || "Subscription expired. Renew to encrypt and send."
        );
      }
      if (res.status === 401) {
        throw new Error(data.error || "Login required. Sign in again.");
      }
      throw new Error(data.error || "Encrypt failed.");
    }
    return {
      ok: true,
      encrypted: true,
      messageCipherText: data.messageCipherText || null,
      fileCipherText: data.fileCipherText || null,
      attachment: data.attachment || null,
      subject: data.subject || form.subject,
      recipientUuid: data.recipientUuid || null,
      recipientEmail: data.recipientEmail || recipientEmail,
      mailMetadata: data.mailMetadata || null,
      contentKind: data.contentKind || null,
    };
  });
}

function sendEncryptedToRecipient_(enc, recipientEmail, accessToken, from, appUrl) {
  var attachment = enc.attachment || {};
  return apiJson("/files/send", {
    method: "POST",
    token: _sessionToken,
    body: {
      recipientEmail: recipientEmail,
      recipientUuid: enc.recipientUuid,
      subject: enc.subject,
      message: enc.messageCipherText || "",
      filename: attachment.fileName || "message.txt",
      contentKind: enc.fileCipherText ? "file" : "message",
      clientSend: true,
    },
  }).then(function () {
    if (typeof sendEncryptedEmailViaGmail !== "function") {
      throw new Error("Gmail send helper not loaded.");
    }
    return sendEncryptedEmailViaGmail({
      accessToken: accessToken,
      from: from,
      to: recipientEmail,
      subject: enc.subject,
      message: enc.messageCipherText || "",
      attachmentName: attachment.fileName,
      attachmentBase64:
        attachment.attachmentBase64 || attachment.base64 || null,
      appUrl: appUrl,
      mailMetadata: enc.mailMetadata || null,
      onProgress: setComposeStatus,
    });
  });
}

var _gmailSendTokenCache = null;

function ensureSendToken_() {
  if (_gmailSendTokenCache && _gmailSendTokenCache.accessToken) {
    return Promise.resolve(_gmailSendTokenCache);
  }
  setComposeStatus("Requesting Gmail send token…");
  return apiJson("/auth/gmail/send-token", {
    method: "POST",
    token: _sessionToken,
    body: {},
  }).then(function (tokenOut) {
    var tokenRes = tokenOut.res;
    var tokenData = tokenOut.data || {};
    if (!tokenRes.ok) {
      throw new Error(
        (tokenData.error || "Gmail not connected.") +
          " Allow Gmail once in the Chrome extension, then Encrypt and send again."
      );
    }
    _gmailSendTokenCache = {
      accessToken: tokenData.accessToken,
      from: tokenData.from || _sessionEmail,
      appUrl: tokenData.appUrl || "",
    };
    return _gmailSendTokenCache;
  });
}

/**
 * Encrypt pipeline: recipient + subject + message → optional Gmail send.
 */
function onEncryptClick(options) {
  options = options || {};
  var wantSend = options.send !== false;

  requireAuthAndSubscription(function (ok, errMsg) {
    if (!ok) {
      setComposeStatus(errMsg || "Sign in with an active subscription to encrypt.");
      return;
    }

    var form = collectEncryptForm();
    if (!form.recipients || !form.recipients.length) {
      setComposeStatus("Add at least one recipient (type email or pick a contact).");
      return;
    }
    if (!String(form.message || "").trim() && !form.file) {
      setComposeStatus("Add a message or a file (or both).");
      return;
    }

    var selfEmail =
      typeof normalizeEmailAddress === "function"
        ? normalizeEmailAddress(_sessionEmail)
        : String(_sessionEmail || "")
            .trim()
            .toLowerCase();
    var toNorm =
      typeof normalizeEmailAddress === "function"
        ? normalizeEmailAddress(form.recipients[0])
        : String(form.recipients[0] || "")
            .trim()
            .toLowerCase();
    if (selfEmail && toNorm && selfEmail === toNorm) {
      setComposeStatus("You cannot send to yourself.");
      return;
    }

    if (form.file && form.file.size > 15 * 1024 * 1024) {
      setComposeStatus(
        "File should be under ~15 MB before encryption so the Gmail message stays within limits."
      );
      return;
    }

    setEncryptButtonsDisabled(true);
    hideEncryptSuccess();
    setComposeStatus(
      wantSend
        ? "Checking login & subscription, then encrypting…"
        : "Encrypting…"
    );

    var filePromise = form.file
      ? readFileAsBase64(form.file).then(function (b64) {
          return {
            fileBase64: b64,
            fileName: form.file.name || "document.bin",
            mimeType: form.file.type || "application/octet-stream",
          };
        })
      : Promise.resolve({});

    filePromise
      .then(function (fileParts) {
        var chain = Promise.resolve();
        var lastEnc = null;
        var sent = [];

        form.recipients.forEach(function (recipientEmail, index) {
          chain = chain.then(function () {
            setComposeStatus(
              "Encrypting " +
                (index + 1) +
                "/" +
                form.recipients.length +
                ": " +
                recipientEmail +
                "…"
            );
            return encryptForRecipient_(recipientEmail, form, fileParts).then(
              function (enc) {
                lastEnc = enc;
                if (!wantSend) return enc;
                return ensureSendToken_().then(function (tok) {
                  setComposeStatus(
                    "Sending encrypted mail to " + recipientEmail + "…"
                  );
                  return sendEncryptedToRecipient_(
                    enc,
                    recipientEmail,
                    tok.accessToken,
                    tok.from,
                    tok.appUrl
                  ).then(function () {
                    sent.push(recipientEmail);
                    return enc;
                  });
                });
              }
            );
          });
        });

        return chain.then(function () {
          if (lastEnc) showEncryptSuccess(lastEnc);
          setEncryptButtonsDisabled(false);
          if (wantSend) {
            var okLabel = document.getElementById("encrypt-success-label");
            if (okLabel) {
              okLabel.textContent = "✔ Encrypted and sent via Gmail";
            }
            setComposeStatus(
              "Sent to " + (sent.length ? sent.join(", ") : "recipients") + "."
            );
            clearEncryptForm_();
          } else {
            setComposeStatus(
              "Encrypted. Copy ciphertext into Gmail, or use Encrypt and send."
            );
          }
        });
      })
      .catch(function (err) {
        setEncryptButtonsDisabled(false);
        setComposeStatus(err.message || String(err));
      });
  });
}

function hideEncryptSuccess() {
  var box = document.getElementById("encrypt-success");
  if (box) box.style.display = "none";
}

function showEncryptSuccess(res) {
  var box = document.getElementById("encrypt-success");
  var out = document.getElementById("encrypt-cipher-out");
  var dl = document.getElementById("encrypt-download");
  if (box) box.style.display = "flex";
  if (out) out.value = res.messageCipherText || "";

  var att = res.attachment || null;
  var fileCipher = res.fileCipherText || (att && (att.content || att.base64)) || null;
  var fileName =
    (att && (att.name || att.filename || att.fileName)) ||
    "encrypted.securefile";
  var mime =
    (att && (att.contentType || att.mimeType)) || "application/octet-stream";

  if (dl) {
    if (fileCipher) {
      dl.style.display = "inline-block";
      dl.href =
        "data:" + mime + ";base64," + String(fileCipher).replace(/\s+/g, "");
      dl.download = fileName;
      dl.textContent = "⬇ Download " + fileName;
    } else {
      dl.style.display = "none";
      dl.removeAttribute("href");
    }
  }
}

function bindDecryptUi() {
  var btnDecrypt = document.getElementById("btn-decrypt");
  var btnRetry = document.getElementById("btn-retry");
  if (btnDecrypt && !btnDecrypt.dataset.bound) {
    btnDecrypt.dataset.bound = "1";
    btnDecrypt.addEventListener("click", onDecryptClick);
  }
  if (btnRetry && !btnRetry.dataset.bound) {
    btnRetry.dataset.bound = "1";
    btnRetry.addEventListener("click", function () {
      showDecryptSection("decrypt-idle");
    });
  }
}

function onDecryptClick() {
  requireAuthOrPrompt(function (ok, errMsg) {
    if (!ok) {
      showDecryptError(errMsg || "Sign in above first, then decrypt.");
      return;
    }
    if (typeof decryptOnly !== "function") {
      showDecryptError("decryptOnly is not loaded. Check common.js.");
      return;
    }

    var recipientEl = document.getElementById("recipient-email");
    var msgEl = document.getElementById("message-cipher");
    var fileEl = document.getElementById("file-cipher");
    var recipient =
      (recipientEl && String(recipientEl.value || "").trim()) ||
      _sessionEmail ||
      "";
    var msgCipher = msgEl ? String(msgEl.value || "").trim() : "";
    var file = fileEl && fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;

    if (!recipient) {
      showDecryptError("Enter your recipient email.");
      return;
    }
    if (!msgCipher && !file) {
      showDecryptError("Paste message ciphertext and/or choose an encrypted file.");
      return;
    }

    showDecryptSection("decrypt-loading");

    function run(fileCipher) {
      decryptOnly({
        apiBaseUrl: apiBase(),
        email: recipient,
        messageCipherText: msgCipher || undefined,
        fileCipherText: fileCipher || undefined,
      })
        .then(function (res) {
          if (!res.ok || !res.decrypted) {
            showDecryptError(
              res.error ||
                (res.code ? "Decryption failed [" + res.code + "]" : "") ||
                "Decryption failed."
            );
            return;
          }
          showDecryptSuccess(res);
        })
        .catch(function (err) {
          showDecryptError(
            "Decryption error: " + (err && err.message ? err.message : String(err))
          );
        });
    }

    if (file) {
      var reader = new FileReader();
      reader.onload = function () {
        var text = String(reader.result || "");
        var comma = text.indexOf(",");
        var b64 = comma >= 0 ? text.slice(comma + 1) : text;
        run(b64);
      };
      reader.onerror = function () {
        showDecryptError("Could not read the encrypted file.");
      };
      reader.readAsDataURL(file);
      return;
    }

    run(null);
  });
}

function showDecryptSection(sectionId) {
  var sections = [
    "decrypt-idle",
    "decrypt-loading",
    "decrypt-error",
    "decrypt-success",
  ];
  for (var i = 0; i < sections.length; i++) {
    var el = document.getElementById(sections[i]);
    if (el) el.style.display = sections[i] === sectionId ? "block" : "none";
  }
}

function showDecryptError(msg) {
  var text = String(msg || "Decryption failed.").trim() || "Decryption failed.";
  var el = document.getElementById("error-msg");
  if (el) el.textContent = text;
  showDecryptSection("decrypt-error");
}

function showDecryptSuccess(res) {
  showDecryptSection("decrypt-success");
  var msgSection = document.getElementById("message-section");
  var msgBox = document.getElementById("decrypted-message");
  var fileSection = document.getElementById("file-section");
  var download = document.getElementById("download-link");
  var okLine = document.querySelector("#decrypt-success .status-ok");

  if (res.message && msgSection && msgBox) {
    msgSection.style.display = "block";
    msgBox.textContent = res.message;
    if (okLine) okLine.textContent = "✔ Decrypted successfully";
  } else if (msgSection) {
    msgSection.style.display = "none";
  }

  var fileInfo =
    typeof extractDecryptedFileBase64 === "function"
      ? extractDecryptedFileBase64(res)
      : null;
  var b64 =
    (fileInfo && fileInfo.base64) ||
    res.decryptedBase64 ||
    (res.file && (res.file.base64 || res.file.decryptedBase64)) ||
    null;
  var name =
    (fileInfo && fileInfo.fileName) ||
    res.filename ||
    (res.file && res.file.filename) ||
    "decrypted.bin";
  var mime =
    (fileInfo && fileInfo.mimeType) ||
    res.mimeType ||
    "application/octet-stream";

  if (b64 && fileSection && download) {
    fileSection.style.display = "block";
    download.href =
      "data:" + mime + ";base64," + String(b64).replace(/\s+/g, "");
    download.download = name;
    download.textContent = "⬇ Download " + name;
  } else if (fileSection) {
    fileSection.style.display = "none";
  }

  if (!res.message && !b64) {
    showDecryptError("Decrypt succeeded but no message or file was returned.");
  }
}

function resetToolPanels() {
  hideEncryptSuccess();
  setComposeStatus("");
  showDecryptSection("decrypt-idle");
  var cipherOut = document.getElementById("encrypt-cipher-out");
  if (cipherOut) cipherOut.value = "";
  var msgCipher = document.getElementById("message-cipher");
  if (msgCipher) msgCipher.value = "";
  var encMsg = document.getElementById("encrypt-message");
  if (encMsg) encMsg.value = "";
}

</script>
